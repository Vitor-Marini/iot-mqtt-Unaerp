# Ambiente FULL LOCAL: sobe os quatro servicos Docker numa rede unica, onde os
# nomes resolvem por DNS (mosquitto, subscriber, influxdb, grafana).
#
# NAO e o modelo de producao deste projeto. Em producao cada servico roda numa
# maquina separada, com seu proprio docker-compose.yml em services/<nome>/.
# Ver README.md -> "Execucao".
#
# Só o ESP32 continua fora: aponte o MQTT_HOST do firmware para o IP desta
# maquina.

name: estacao-meteorologica

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./services/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?defina INFLUXDB_PASSWORD no .env da raiz}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-esp32}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sensors}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-0}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env da raiz}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  subscriber:
    build:
      context: ./services/subscriber
      dockerfile: Dockerfile
    image: iot-subscriber:local
    container_name: subscriber
    restart: unless-stopped
    # Espera os dois ficarem saudaveis: sem o bucket provisionado, toda escrita
    # falharia nos primeiros segundos.
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      SUBSCRIBER_ID: ${SUBSCRIBER_ID:-DB_SUBSCRIBER}
      INFLUX_HOST: http://influxdb:8086
      # Atencao ao nome: o codigo le TOKEN_INFLUX, nao INFLUX_TOKEN.
      TOKEN_INFLUX: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env da raiz}
      INFLUX_ORG: ${INFLUXDB_ORG:-esp32}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET:-sensors}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Consumidas pelo provisioning/datasources/influxdb.yml
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG:-esp32}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensors}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env da raiz}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  ota-server:
    build:
      context: ./services/ota-server
      dockerfile: Dockerfile
    image: iot-ota-server:local
    container_name: ota-server
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      OTA_PORT: "8080"
      OTA_EXTERNAL_HOST: ${OTA_EXTERNAL_HOST:-192.168.1.100}
      STORAGE_DIR: /app/storage
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC_BASE: ${MQTT_TOPIC_BASE:-devices}
    ports:
      - "${OTA_PORT:-8080}:8080"
    volumes:
      - ./services/ota-server/storage:/app/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  grafana_data:
