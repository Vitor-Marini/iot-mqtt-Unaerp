# Mosquitto — broker MQTT da estação meteorológica
# Referência: https://mosquitto.org/man/mosquitto-conf-5.html

# ------------------------------------------------------------------ Rede ----
listener 1883 0.0.0.0
protocol mqtt

# ---------------------------------------------------------- Autenticação ----
# ATENÇÃO: acesso anônimo. Adequado para a rede isolada de laboratório deste
# projeto, NUNCA para uma rede exposta. Para habilitar autenticação, veja a
# seção "Segurança" no README.md deste serviço.
allow_anonymous true

# ----------------------------------------------------------- Persistência ---
# Guarda mensagens retained e sessões QoS 1 entre reinícios do container.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ------------------------------------------------------------------- Log ----
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ----------------------------------------------------------------- Limites --
# Payload da estação tem ~200 bytes; 1 KiB é folga suficiente e barra abuso.
message_size_limit 1024
max_queued_messages 1000
max_keepalive 120
