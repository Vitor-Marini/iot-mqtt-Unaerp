# Sobe SOMENTE o subscriber, para deploy em maquina propria.
# Para subir a stack inteira numa maquina, use o docker-compose.yml da raiz.
services:
  subscriber:
    build:
      context: .
      dockerfile: Dockerfile
    image: iot-subscriber:local
    container_name: subscriber
    restart: unless-stopped
    # Obrigatorio: INFLUX_HOST, TOKEN_INFLUX, INFLUX_ORG e INFLUX_BUCKET nao
    # tem valor padrao no codigo. Sem .env o servico sobe e falha nas escritas.
    env_file:
      - .env
    # Sem `ports`: o subscriber nao serve HTTP, so faz conexoes de saida.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
