services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      # 0.0.0.0 de proposito: o subscriber e o Grafana vem de outras maquinas.
      - "0.0.0.0:${INFLUXDB_PORT:-8086}:8086"
    environment:
      # Provisionamento automatico no primeiro boot (volume vazio).
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?defina INFLUXDB_PASSWORD no .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-esp32}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-sensors}
      # 0 = retencao infinita. Ex.: 30d para descartar dados antigos.
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-0}
      # Token fixo: sem ele o InfluxDB gera um aleatorio e o subscriber
      # nao teria como se autenticar sem intervencao manual.
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?defina INFLUXDB_TOKEN no .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  influxdb_data:
  influxdb_config:
